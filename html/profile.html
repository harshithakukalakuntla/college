<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile | CampusPulse</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body class="dashboard-page">

  <!-- Top Demo Bar -->
  <div class="demo-role-banner" id="demo-role-banner"></div>

  <!-- Navbar -->
  <header class="site-navbar" id="main-navbar"></header>

  <!-- Profile Layout -->
  <main class="main-content section-spacer">
    <div class="container" style="max-width: 860px;">
      
      <!-- Profile Header Card -->
      <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 2rem; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 2rem; margin-bottom: 2rem; flex-wrap: wrap;">
        <div style="position: relative;">
          <img id="profile-avatar-preview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Avatar" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary-light);" />
        </div>

        <div>
          <h2 id="profile-display-name" style="margin-bottom: 0.25rem;">Loading user...</h2>
          <p id="profile-display-role" class="text-muted" style="margin-bottom: 0.75rem; font-size: 0.95rem; font-weight: 600;">Student</p>
          
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <button type="button" class="btn btn-xs btn-outline-primary" onclick="selectPresetAvatar('https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=300&q=80')">Avatar 1</button>
            <button type="button" class="btn btn-xs btn-outline-primary" onclick="selectPresetAvatar('https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80')">Avatar 2</button>
            <button type="button" class="btn btn-xs btn-outline-primary" onclick="selectPresetAvatar('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80')">Avatar 3</button>
            <button type="button" class="btn btn-xs btn-outline-primary" onclick="selectPresetAvatar('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80')">Avatar 4</button>
          </div>
        </div>
      </div>

      <!-- Edit Form Card -->
      <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 2.25rem; box-shadow: var(--shadow-sm);">
        <h3 style="font-size: 1.35rem; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-color);">
          Edit Profile Information
        </h3>

        <form id="profile-edit-form">
          <div class="grid grid-cols-2" style="gap: 1.25rem;">
            <div class="form-group">
              <label class="form-label" for="prof-name">Full Name</label>
              <input type="text" id="prof-name" class="form-control" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-email">College Email (Primary Key)</label>
              <input type="email" id="prof-email" class="form-control" readonly style="background: var(--bg-subtle);" />
            </div>
          </div>

          <div class="grid grid-cols-2" style="gap: 1.25rem;">
            <div class="form-group">
              <label class="form-label" for="prof-roll">Roll / Registration Number</label>
              <input type="text" id="prof-roll" class="form-control" placeholder="2024CS1082" />
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-dept">Department</label>
              <input type="text" id="prof-dept" class="form-control" placeholder="Computer Science & Engineering" />
            </div>
          </div>

          <div class="grid grid-cols-2" style="gap: 1.25rem;">
            <div class="form-group">
              <label class="form-label" for="prof-year">Academic Year</label>
              <select id="prof-year" class="form-select">
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
                <option value="Postgraduate">Postgraduate</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-phone">Phone Number</label>
              <input type="tel" id="prof-phone" class="form-control" placeholder="+91 91234 56789" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="prof-avatar-url">Avatar Image URL</label>
            <input type="url" id="prof-avatar-url" class="form-control" placeholder="https://..." />
            <span class="form-hint">Paste an image link or click any of the avatar presets above.</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="prof-bio">Short Bio & Interests</label>
            <textarea id="prof-bio" class="form-textarea" rows="3" placeholder="Tell organizers and fellow students about your technical and cultural interests..."></textarea>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
            <a href="student-dashboard.html" class="btn btn-outline-primary">Back to Dashboard</a>
            <button type="submit" class="btn btn-primary" id="btn-save-profile">
              Save Changes
            </button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        <div>&copy; 2026 CampusPulse Event Management System.</div>
        <div>All rights reserved.</div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
