<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Student Account | CampusPulse</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(135deg, #EEF2FF 0%, #FAF5FF 100%);">

  <!-- Top Demo Bar -->
  <div class="demo-role-banner" id="demo-role-banner"></div>

  <!-- Navbar -->
  <header class="site-navbar" id="main-navbar"></header>

  <!-- Register Form Container -->
  <main class="main-content" style="display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div style="max-width: 580px; width: 100%; background: var(--bg-surface); padding: 2.5rem; border-radius: var(--radius-xl); border: 1px solid var(--border-color); box-shadow: var(--shadow-lg);">
      
      <div class="text-center" style="margin-bottom: 2rem;">
        <span style="font-size: 2.5rem; display: inline-block; margin-bottom: 0.5rem;">🎓</span>
        <h2 style="font-size: 1.75rem; margin-bottom: 0.35rem;">Create Student Account</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Join thousands of students registering for university fests & workshops</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Aarav Patel" required />
        </div>

        <div class="grid grid-cols-2" style="gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-email">College Email *</label>
            <input type="email" id="reg-email" class="form-control" placeholder="rollno@college.edu" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password">Password *</label>
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="4" required />
          </div>
        </div>

        <div class="grid grid-cols-2" style="gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-roll">Roll / Registration Number *</label>
            <input type="text" id="reg-roll" class="form-control" placeholder="e.g. 2024CS1082" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-dept">Department *</label>
            <select id="reg-dept" class="form-select" required>
              <option value="Computer Science & Engineering">Computer Science & Engg</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electronics & Communication">Electronics & Communication</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Civil Engineering">Civil Engineering</option>
              <option value="Biotechnology">Biotechnology</option>
              <option value="Business & Management">Business & Management</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2" style="gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-year">Academic Year</label>
            <select id="reg-year" class="form-select">
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year" selected>3rd Year</option>
              <option value="4th Year">4th Year</option>
              <option value="Postgraduate">Postgraduate</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-phone">Contact Phone</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-register-submit" style="margin-top: 1.25rem;">
          Complete Registration &rarr;
        </button>
      </form>

      <div class="text-center" style="margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="font-weight: 600;">Sign in here</a>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-register-submit');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      const userData = {
        name: document.getElementById('reg-name').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        password: document.getElementById('reg-password').value,
        rollNumber: document.getElementById('reg-roll').value.trim(),
        department: document.getElementById('reg-dept').value,
        year: document.getElementById('reg-year').value,
        phone: document.getElementById('reg-phone').value.trim(),
        role: 'student'
      };

      try {
        await window.auth.register(userData);
        window.main.showToast('Account registered successfully! Welcome to CampusPulse.', 'success');
        setTimeout(() => {
          window.location.href = 'student-dashboard.html';
        }, 600);
      } catch (err) {
        window.main.showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Complete Registration →';
      }
    });
  </script>
</body>
</html>
